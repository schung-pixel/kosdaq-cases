name: 딜북 일일 자동 수집
on:
  schedule:
    - cron: '10 21 * * *'   # 매일 06:10 KST
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/dealbook-daily.yml'
      - 'deals/tools/daily_collect.py'
permissions:
  contents: write
concurrency:
  group: dealbook-daily
  cancel-in-progress: false
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install --quiet rdkit
      - name: 수집
        run: python deals/tools/daily_collect.py
      - name: 커밋
        run: |
          git config user.name "dealbook-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deals/data deals/chem deals/sw.js
          if git diff --cached --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "딜북 일일 자동 수집 $(TZ=Asia/Seoul date +%F)"
          for i in 1 2 3; do git pull --rebase -q origin main && git push -q origin HEAD:main && break; sleep 10; done
